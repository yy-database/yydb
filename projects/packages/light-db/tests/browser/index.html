<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>Light DB browser conformance</title>
</head>
<body>
    <h1>Light DB browser conformance</h1>
    <pre id="results">running…</pre>
    <script type="module">
        import { runBrowserSuite } from "/tests/browser/suite.js";

        const scope = globalThis;
        scope.__lightDbDone = false;
        scope.__lightDbResults = [];

        try {
            scope.__lightDbResults = await runBrowserSuite();
            document.getElementById("results").textContent = JSON.stringify(scope.__lightDbResults, null, 2);
        } catch (error) {
            scope.__lightDbResults = [{ name: "suite", ok: false, error: String(error) }];
            document.getElementById("results").textContent = String(error);
        } finally {
            scope.__lightDbDone = true;
        }
    </script>
</body>
</html>
