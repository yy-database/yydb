[package]
name = "yydb-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser WebAssembly binding for YYDB"
readme = "readme.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
database = { workspace = true, features = [
    "types",
    "query",
    "execution",
    "udf",
    "storage",
    "protocol-yy",
] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
getrandom = { workspace = true }

# `database.execution` reaches `getrandom 0.2` through `boost-crypto` -> `rsa`
# -> `rand`. That major version refuses to build for `wasm32-unknown-unknown`
# unless its `js` backend is selected, so the binding picks it here instead of
# leaving the wasm target unbuildable.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json = { workspace = true }
database = { workspace = true, features = [
    "types",
    "query",
    "execution",
    "udf",
    "storage",
    "protocol-yy",
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
