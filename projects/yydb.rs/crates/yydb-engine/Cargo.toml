[package]
name = "yydb-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "YYDB database runtime: connection, catalog, CAS, journal, leases and UDF session state"
homepage = "https://github.com/yy-database/yydb"
documentation = "https://docs.rs/yydb-engine"
keywords = ["database", "embedded", "storage", "vos"]
categories = ["database-implementations", "embedded"]

[dependencies]
vos = { workspace = true }
yydb-types = { workspace = true }
yydb-storage = { workspace = true }
yydb-execution = { workspace = true }
yydb-udf = { workspace = true }
yydb-query = { workspace = true }
serde_json = { workspace = true }
# wasm-bindgen + js-sys: only needed at wasm32 target (SystemTime::now panics on
# browser WASM targets). Kept as optional so native builds stay lean.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
