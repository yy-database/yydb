[package]
name = "yydb-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite-referenced measurement harness for YYDB (batch load, single writes, point gets, range scans, reopen)"
homepage = "https://github.com/yy-database/yydb"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "yydb-bench"
path = "src/main.rs"

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
yydb = { workspace = true }
yydb-storage = { workspace = true }
