[package]
name = "yydb-query"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend-neutral query planning and DML execution for YYDB"
readme = "readme.md"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
oak-sql = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
vos = { workspace = true }
yydb-types = { workspace = true }

[dev-dependencies]
vos = { workspace = true }
yydb-types = { workspace = true }

# wasm-bindgen + js-sys: only needed at wasm32 target, where `SystemTime::now`
# panics because the std time backend is disabled.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
