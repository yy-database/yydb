[workspace]
resolver = "2"
members = [
    "yydb-napi",
    "yydb-pyo3",
    "yydb-wasm",
]
default-members = ["yydb-napi"]

[workspace.package]
version = "0.0.18"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/yydb"

[workspace.dependencies]
# Sole database.rs dependency  on  the `yydb` facade. Pin full 40-char rev.
# Local absolute path overrides belong in `.cargo/config.toml` (facade only).
yydb = { git = "https://github.com/oovm/database.rs.git", rev = "e800af84746bad3cd9c11a57bc5b59946b0420be" }
sqlite = { git = "https://github.com/oovm/database.rs.git", rev = "e800af84746bad3cd9c11a57bc5b59946b0420be" }

blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi = { version = "3.14.2", default-features = false, features = ["napi4", "napi6"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
