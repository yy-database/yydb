[workspace]
resolver = "2"
members = ["crates/*", "ffis/*"]

[workspace.package]
version = "0.0.18"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/yydb"

[workspace.dependencies]
vos = { git = "https://github.com/voml/vos-language.git", rev = "1423d656d61ac27cca9ebc2016ffc9ded4b0f5c8" }
# SQL frontend parser (Oak). The SQL AST feeds `yydb-query`'s lowering pass.
oak-sql = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "24bd4883", package = "oak-sql" }
# Engine (bottom → mid; depend on yydb facade in apps)
yydb-types = { version = "0.0.18", path = "crates/yydb-types" }
yydb-formats = { version = "0.0.18", path = "crates/yydb-formats" }
yydb-execution = { version = "0.0.18", path = "crates/yydb-execution" }
yydb-udf = { version = "0.0.18", path = "crates/yydb-udf" }
yydb-query = { version = "0.0.18", path = "crates/yydb-query" }
yydb-storage = { version = "0.0.18", path = "crates/yydb-storage" }
yydb-engine = { version = "0.0.18", path = "crates/yydb-engine" }
yydb-protocol = { version = "0.0.18", path = "crates/yydb-protocol" }
# Facade
yydb = { version = "0.0.18", path = "crates/yydb" }
# Transport (aggregated by the facade; never depend back on `yydb`)
yydb-client = { path = "crates/yydb-client" }
yydb-server = { path = "crates/yydb-server" }
# SQLite split: format primitives, storage runtime, and product facade
sqlite-formats = { version = "0.1.0", path = "crates/sqlite-formats" }
sqlite-storage = { version = "0.1.0", path = "crates/sqlite-storage" }
sqlite = { version = "0.1.0", path = "crates/sqlite" }
# Language bindings (thin; every Rust capability comes from `yydb`)
yydb-napi = { path = "ffis/yydb-napi" }
yydb-pyo3 = { path = "ffis/yydb-pyo3" }
# Third party
blake3 = "1"
sha1 = "0.11.0"
base64 = "0.23.1"
uuid = { version = "1", features = ["serde", "v4"] }
serde = "1"
serde_json = "1"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }
napi = { version = "3.14.2", default-features = false, features = ["napi4", "napi6"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
