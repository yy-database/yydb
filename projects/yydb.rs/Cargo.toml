[workspace]
resolver = "2"
members = [
    "yydb-napi",
    "yydb-pyo3",
    "yydb-wasm",
]
default-members = ["yydb-napi"]

[workspace.package]
version = "0.0.18"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/yydb"

[workspace.dependencies]
# `database` is the single stable public facade of the boost.rs database ecosystem. Pin full 40-char rev.
# Local absolute path overrides belong in `.cargo/config.toml` (facade only).
# VOS types are used directly by the native bindings, at the rev boost.rs pins.
database = { git = "https://github.com/oovm/boost.rs.git", rev = "70aee1ebc60e0104a88f214ee46af37477b402a7", default-features = false }
vos = { git = "https://github.com/voml/vos-language.git", rev = "387d9fc3c9a556ddb8a433c627a866a2918d0186" }

blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi = { version = "3.14.2", default-features = false, features = ["napi4", "napi6"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
