[package]
name = "yydb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded single-file database with native VOS schema semantics"
homepage = "https://github.com/yy-database/yydb.rs"
documentation = "https://docs.rs/yydb"
readme = "readme.md"
keywords = ["database", "embedded", "storage", "vos"]
categories = ["database-implementations", "embedded"]

[lib]
path = "src/lib.rs"

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
sha1 = { workspace = true }
vos = { workspace = true }
yydb-types = { workspace = true }
yydb-execution = { workspace = true }
yydb-udf = { workspace = true }
yydb-query = { workspace = true }
serde_json = { workspace = true }
yydb-format = { workspace = true }

[dev-dependencies]
yydb-format = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

