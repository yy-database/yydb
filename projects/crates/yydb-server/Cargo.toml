[package]
name = "yydb-server"
version.workspace = true
edition.workspace = true
description = "YYDB wire server (TCP + WebSocket /wire) for out-of-process clients"
license = "MPL-2.0"
repository = "https://github.com/yy-database/yydb.rs"
homepage = "https://github.com/yy-database/yydb.rs"
readme = "README.md"
