[package]
name = "yydb-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "YYDB database runtime: connection, catalog, CAS, journal, leases and UDF session state"
homepage = "https://github.com/yy-database/yydb.rs"
documentation = "https://docs.rs/yydb-engine"
keywords = ["database", "embedded", "storage", "vos"]
categories = ["database-implementations", "embedded"]

[dependencies]
vos = { workspace = true }
yydb-types = { workspace = true }
yydb-formats = { workspace = true }
yydb-execution = { workspace = true }
yydb-udf = { workspace = true }
yydb-query = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }
