[package]
name = "yydb-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable YYDB file access: locking, snapshot commit, WAL coordination and CAS blob I/O"
homepage = "https://github.com/yy-database/yydb"
documentation = "https://docs.rs/yydb-storage"
keywords = ["database", "storage", "wal", "cas"]
categories = ["database-implementations"]
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
yydb-types = { workspace = true }
yydb-formats = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }
