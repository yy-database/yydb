[package]
name = "yydb-napi"
version.workspace = true
edition.workspace = true
description = "Node-API bindings for YYDB serve and embedded engine access"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
name = "yydb_napi"

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4"] }
napi-derive = "2.16"
yydb = { path = "../yydb" }
yydb-server = { path = "../yydb-server" }

[build-dependencies]
napi-build = "2.6"
