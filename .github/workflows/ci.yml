name: CI

# Check/test only. Publish is a separate workflow (release-npm.yml) on v*.*.* tags.
on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt
      - run: cargo fmt --all --check

  rust-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build -p yydb-napi --release

  ts:
    name: pnpm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # version from package.json packageManager (pnpm@10.18.3)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yydb/yydb-client build
      - run: pnpm --filter @yydb/yydb-client test
      - run: pnpm --filter @yydb/yydb build
      - run: pnpm --filter @yydb/yydb test
      - run: pnpm --filter @yydb/yydb-webui build
      - run: pnpm --filter @yydb/yydb-homepage build
