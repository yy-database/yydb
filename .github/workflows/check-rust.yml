name: Check Rust

# Rust fmt/test only. TypeScript checks: check-typescript.yml
# Publish: release-npm.yml on v*.*.* tags.
on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: projects/yydb.rs

jobs:
  rust-fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt
      - run: cargo fmt --all --check

  rust-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/yydb.rs
      # `yydb-napi` is cdylib-only and needs Node `napi_*` symbols at link time.
      # Cover it with `cargo build` below; host behaviour is asserted in TypeScript.
      - run: cargo test --workspace --exclude yydb-napi
      - run: cargo build -p yydb-napi --release
