name: Check TypeScript

# pnpm package build/test and Nifty format check. Rust checks: check-rust.yml
# Publish: release-npm.yml on v*.*.* tags.
on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

jobs:
  typescript:
    name: pnpm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # version from package.json packageManager (pnpm@10.18.3)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - run: rustc --version && cargo --version
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build native addon
        run: pnpm run build:napi
      - run: pnpm run build:wasm
      - run: pnpm --filter @yydb/yydb-unknown-wasm32 build
      - run: pnpm --filter @yydb/yydb-client build
      - run: pnpm --filter @yydb/yydb build
      - run: pnpm --filter @yydb/yydb-client test
      - run: pnpm --filter @yydb/yydb test
      - run: pnpm --filter @yydb/light-db build
      - run: pnpm --filter @yydb/light-db test
      - run: pnpm --filter @yydb/light-db test:browser
      - run: pnpm --filter @yydb/yydb-webui check
      - run: pnpm --filter @yydb/yydb-homepage build
      - name: Packed install state for @yydb/yydb
        run: node scripts/check-install-state.mjs --only=@yydb/yydb
      - name: Packed install state for @yydb/yydb-client
        run: node scripts/check-install-state.mjs --only=@yydb/yydb-client
      - name: Packed install state for @yydb/light-db
        run: node scripts/check-install-state.mjs --only=@yydb/light-db
