name: Check Python

# Python binding only. Rust workspace checks: check-rust.yml
on:
  push:
    branches: [dev]
    paths:
      - "projects/yydb.py/**"
      - "projects/yydb.rs/ffis/yydb-pyo3/**"
      - ".github/workflows/check-python.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [dev]
    paths:
      - "projects/yydb.py/**"
      - "projects/yydb.rs/ffis/yydb-pyo3/**"
      - ".github/workflows/check-python.yml"
      - "package.json"
      - "pnpm-workspace.yaml"

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: projects/yydb.py/packages/yydb

jobs:
  python:
    name: yydb-pyo3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/yydb.rs
      - name: Install maturin
        run: python -m pip install --upgrade pip "maturin>=1.7,<2.0"
      - name: Check formatting
        working-directory: projects/yydb.rs
        run: cargo fmt -p yydb-pyo3 --check
      - name: Cargo check
        working-directory: projects/yydb.rs
        run: cargo check -p yydb-pyo3
      - name: Cargo test
        working-directory: projects/yydb.rs
        run: cargo test -p yydb-pyo3
      - name: Build wheel
        run: maturin build --out dist
      - name: Install the wheel into a clean virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          $python = if ($env:RUNNER_OS -eq "Windows") { "./.venv/Scripts/python.exe" } else { "./.venv/bin/python" }
          & $python -m pip install --upgrade pip
          & $python -m pip install (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          & $python -c "import yydb, yydb_pyo3; print(yydb.version())"
      - name: Run unit tests
        shell: pwsh
        run: |
          $python = if ($env:RUNNER_OS -eq "Windows") { "./.venv/Scripts/python.exe" } else { "./.venv/bin/python" }
          & $python -m unittest discover -s tests -v
      - name: Run the embedded example
        shell: pwsh
        run: |
          $python = if ($env:RUNNER_OS -eq "Windows") { "./.venv/Scripts/python.exe" } else { "./.venv/bin/python" }
          & $python ../../examples/embedded/main.py
