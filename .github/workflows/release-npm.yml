name: Release

# Independent of CI (check/test). Trigger only by pushing a semver tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Publishes @yydb/* (OIDC) and GitHub Release native-binding zips.
# Already-published npm versions / existing release assets are skipped (retry-safe).
# Trusted Publisher workflow filename must stay: release-npm.yml
# Release setup: AGENTS.md

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-engine:
    name: engine ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: yydb-win32-x64
            node_file: yydb.win32-x64.node
            lib: yydb_napi.dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: yydb-linux-x64
            node_file: yydb.linux-x64.node
            lib: libyydb_napi.so
          - os: macos-latest
            target: x86_64-apple-darwin
            pkg: yydb-darwin-x64
            node_file: yydb.darwin-x64.node
            lib: libyydb_napi.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: yydb-darwin-arm64
            node_file: yydb.darwin-arm64.node
            lib: libyydb_napi.dylib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build yydb-napi
        run: cargo build -p yydb-napi --release --target ${{ matrix.target }}
      - name: Stage native binding
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/${{ matrix.target }}/release/${{ matrix.lib }}"
          DEST="projects/packages/${{ matrix.pkg }}/${{ matrix.node_file }}"
          cp "$SRC" "$DEST"
          chmod +x "$DEST" || true
          ls -la "$DEST"
      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.pkg }}
          path: projects/packages/${{ matrix.pkg }}/${{ matrix.node_file }}
          if-no-files-found: error

  publish-npm:
    name: publish npm
    needs: build-engine
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # version from package.json packageManager (pnpm@10.18.3)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@yydb"
          cache: pnpm
      - name: Ensure npm CLI supports OIDC
        run: |
          npm install -g npm@latest
          node -v
          npm -v
      - run: pnpm install --frozen-lockfile

      - name: Download engine artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: engine-*
          path: _engines

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "expected semver tag like v1.2.3, got: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing version $version (tag $tag)"

      - name: Prepare packages for publish
        env:
          INPUT_VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/prepare-npm-publish.mjs

      - run: pnpm --filter @yydb/yydb-client build
      - run: pnpm --filter @yydb/yydb build

      # OIDC only ? do not set NODE_AUTH_TOKEN (even empty).
      - name: Publish npm
        run: node scripts/publish-npm-packages.mjs

  github-release:
    name: github release zips
    needs: build-engine
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download engine artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: engine-*
          path: _engines

      - name: Upload zips to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-github-release-zips.mjs
