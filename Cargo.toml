[workspace]
resolver = "2"
members = ["projects/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/yydb.rs"

[workspace.dependencies]
# third-party
blake3 = "1"
sha1 = "0.11.0"
base64 = "0.23.1"
uuid = { version = "1", features = ["serde", "v4"] }
serde_json = "1"
vos = { git = "https://github.com/voml/vos-language.git", branch = "dev" }
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }

# engine (bottom → mid; depend on yydb facade in apps)
yydb-types = { version = "0.1.0", path = "projects/crates/yydb-types" }
yydb-formats = { version = "0.1.0", path = "projects/crates/yydb-formats" }
yydb-execution = { version = "0.1.0", path = "projects/crates/yydb-execution" }
yydb-udf-types = { version = "0.1.0", path = "projects/crates/yydb-udf-types" }
yydb-udf = { version = "0.1.0", path = "projects/crates/yydb-udf" }
yydb-query = { version = "0.1.0", path = "projects/crates/yydb-query" }
yydb-store = { version = "0.1.0", path = "projects/crates/yydb-store" }
yydb-protocol = { version = "0.1.0", path = "projects/crates/yydb-protocol" }

# facade
yydb = { path = "projects/crates/yydb" }

# transport (siblings of the facade — no cycle back into yydb)
yydb-client = { path = "projects/crates/yydb-client" }
yydb-server = { path = "projects/crates/yydb-server" }

# language bindings (thin; yydb + yydb-server only)
yydb-napi = { path = "projects/crates/yydb-napi" }
yydb-pyo3 = { path = "projects/crates/yydb-pyo3" }
