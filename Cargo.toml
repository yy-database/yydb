[workspace]
resolver = "2"
members = ["projects/crates/*"]

[workspace.package]
version = "0.0.16"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/yydb.rs"

[workspace.dependencies]
vos = { git = "https://github.com/voml/vos-language.git", rev = "74e257ec7e0ffdaf6d2d8ac5be38f4e88e5debd4" }
# Engine (bottom → mid; depend on yydb facade in apps)
yydb-types = { version = "0.0.16", path = "projects/crates/yydb-types" }
yydb-formats = { version = "0.0.16", path = "projects/crates/yydb-formats" }
yydb-execution = { version = "0.0.16", path = "projects/crates/yydb-execution" }
yydb-udf = { version = "0.0.16", path = "projects/crates/yydb-udf" }
yydb-query = { version = "0.0.16", path = "projects/crates/yydb-query" }
yydb-storage = { version = "0.0.16", path = "projects/crates/yydb-storage" }
yydb-engine = { version = "0.0.16", path = "projects/crates/yydb-engine" }
yydb-protocol = { version = "0.0.16", path = "projects/crates/yydb-protocol" }
# Facade
yydb = { version = "0.0.16", path = "projects/crates/yydb" }
# Transport (aggregated by the facade; never depend back on `yydb`)
yydb-client = { path = "projects/crates/yydb-client" }
yydb-server = { path = "projects/crates/yydb-server" }
# Language bindings (thin; every Rust capability comes from `yydb`)
yydb-napi = { path = "projects/crates/yydb-napi" }
yydb-pyo3 = { path = "projects/crates/yydb-pyo3" }
# Third party
blake3 = "1"
sha1 = "0.11.0"
base64 = "0.23.1"
uuid = { version = "1", features = ["serde", "v4"] }
serde_json = "1"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
